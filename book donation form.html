<!DOCTYPE html>
<html>
    <head>
        <meta UTF="8">
        <title>Book Donation Form</title>
    </head>

    <body>
        <h1>Book donation form</h1>
        <p>fill in this form to help donate forms</p>

        <form>

            <fieldset>
                <legend>Donor details</legend>
                <input type="text" id="name" placeholder="Enter your name here"> <br>  <br>
                <input type="password" id=" donor id" placeholder="enter your donor id here"> <br> <br>
                <input type="date" id="calendar" placeholder="choose the donation date"
                <input type="password" id="password" placeholder="enter your password here"> <br> <br>

            </fieldset>

            <fieldset>
                <legend>book type</legend>
                <input type="checkbox"  value="fiction"> fiction
                <input type="checkbox" value="biography"> biography
                <input type="checkbox" value="manga"> manga
            </fieldset>

            <fieldset>
                <legend>Book condition</legend>
                <input type="radio" name="condition" value="good"> good
                <input type="radio" name="condition" value="used"> used
                <input type="radio" name="condition" value="damaged"> damaged
            </fieldset>

            <fieldset>
                <legend>addition notes</legend>
                <input type="text" id="notes" placeholder="write the book title or any thing you think we have missed out">
            </fieldset>

            <fieldset>
                
                <input type="submit" value="donate ">
            </fieldset>
        </form>
    </body>
</html>
